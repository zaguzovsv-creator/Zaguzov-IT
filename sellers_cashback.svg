<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbfd" />
      <stop offset="50%" stop-color="#f8f6fe" />
      <stop offset="100%" stop-color="#f3effe" />
    </linearGradient>

    <!-- Purple Glow -->
    <radialGradient id="purple-glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9d5ff" stroke-width="1" stroke-opacity="0.35" />
    </pattern>

    <!-- Text Purple Gradient -->
    <linearGradient id="wb-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Main CTA Button Gradient -->
    <linearGradient id="btn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Top Button Gradient -->
    <linearGradient id="top-btn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#7c3aed" flood-opacity="0.12" />
    </filter>

    <filter id="btn-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <rect width="1920" height="1080" fill="url(#purple-glow)" />

  <!-- TOP NAVBAR -->
  <g transform="translate(140, 40)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#6366f1" />
    <!-- Refresh Arrows Icon inside logo -->
    <g transform="translate(10, 10)">
      <path d="M 4 12 A 8 8 0 0 1 18 8 L 22 12 M 22 4 V 12 H 14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 20 12 A 8 8 0 0 1 6 16 L 2 12 M 2 20 V 12 H 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Logo Text -->
    <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">
      <tspan fill="#1e1b4b">Sellers</tspan><tspan fill="#4f46e5">CashBack</tspan>
    </text>

    <!-- Right Navbar Button -->
    <g transform="translate(1460, 0)">
      <rect x="0" y="-2" width="180" height="48" rx="14" fill="url(#top-btn-grad)" />
      <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
        Открыть сервис
      </text>
    </g>
  </g>

  <!-- HERO CENTER CONTENT -->
  <g transform="translate(960, 290)">

    <!-- Free Access Pill Tag -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#FFFFFF" stroke="#f0abfc" stroke-width="1.5" />
      
      <!-- Green dot indicator -->
      <circle cx="-210" cy="0" r="5" fill="#22c55e" />
      
      <!-- Gift icon / Accent -->
      <text x="-192" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#d97706">🎁</text>

      <text x="-170" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">
        Открытый бесплатный доступ без регистрации и оплаты!
      </text>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 140)">
      <!-- Line 1 -->
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#0f172a" letter-spacing="-2">
        Верните упущенную
      </text>
      <!-- Line 2 -->
      <text x="0" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-2">
        <tspan fill="#0f172a">прибыль с </tspan><tspan fill="url(#wb-purple)">Wildberries</tspan>
      </text>
    </g>

    <!-- Subtitle Paragraph -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400">
        <tspan x="0" dy="0">Автоматический поиск переплат за логистику и хранение. Полный функционал</tspan>
        <tspan x="0" dy="34">сервиса открыт без ограничений, без регистрации и без оплат для всех</tspan>
        <tspan x="0" dy="34">селлеров.</tspan>
      </text>
    </g>

    <!-- Call To Action Group -->
    <g transform="translate(-250, 480)">
      <!-- Main Action Button -->
      <g transform="translate(0, 0)" filter="url(#btn-shadow)">
        <rect x="0" y="0" width="370" height="66" rx="18" fill="url(#btn-grad)" />
        <text x="170" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
          Проверить переплаты прямо сейчас
        </text>
        <path d="M 326 33 L 338 33 M 333 27 L 339 33 L 333 39" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- 100% Free Pill Badge -->
      <g transform="translate(390, 8)">
        <rect x="0" y="0" width="220" height="50" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
        <text x="110" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#059669">
          100% Бесплатно для всех
        </text>
      </g>
    </g>

  </g>
</svg>