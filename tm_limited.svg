<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0904" />
      <stop offset="50%" stop-color="#070603" />
      <stop offset="100%" stop-color="#030302" />
    </linearGradient>

    <radialGradient id="gold-glow" cx="0.25" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#b47818" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#7c520e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="gold-btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#523d14" />
      <stop offset="100%" stop-color="#3d2c0d" />
    </linearGradient>

    <linearGradient id="gold-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#785312" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#362407" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base Layout -->
  <!-- Left Side Background -->
  <rect x="0" y="0" width="960" height="1080" fill="url(#bg-left)" />
  <rect x="0" y="0" width="960" height="1080" fill="url(#gold-glow)" />

  <!-- Right Side Background -->
  <rect x="960" y="0" width="960" height="1080" fill="#000000" />

  <!-- Divider Line -->
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#12100d" stroke-width="1" />

  <!-- LEFT SIDE CONTENT -->
  <g transform="translate(100, 80)">
    <!-- Logo -->
    <g transform="translate(0, 0)">
      <!-- Golden Emblem/Crest -->
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#141009" stroke="#382811" stroke-width="1" />
      <path d="M 28 14 L 33 22 L 42 22 L 35 28 L 38 38 L 28 32 L 18 38 L 21 28 L 14 22 L 23 22 Z" fill="url(#text-gold)" />
      <path d="M 20 42 L 36 42 M 23 45 L 33 45" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Main Headline -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Ваш ключ к</text>
    <text x="0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#text-gold)" letter-spacing="-1">успешной аналитике</text>

    <!-- Subtitle -->
    <text x="0" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#a1a1aa" font-weight="400">
      <tspan x="0" dy="0">Платформа TM LIMITED объединяет данные,</tspan>
      <tspan x="0" dy="32">инструменты парсинга и прогнозы в одном</tspan>
      <tspan x="0" dy="32">интуитивном пространстве.</tspan>
    </text>

    <!-- Horizontal Divider -->
    <line x1="0" y1="510" x2="720" y2="510" stroke="#261d10" stroke-width="1.5" />

    <!-- Feature 1: Сводная аналитика -->
    <g transform="translate(0, 560)">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="#17120a" stroke="url(#gold-border)" stroke-width="1.5" />
      <!-- Chart Icon -->
      <path d="M 16 34 L 23 26 L 29 30 L 36 18 M 31 18 H 36 V 23" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="72" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Сводная аналитика</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">Вся прибыль и метрики как на ладони</text>
    </g>

    <!-- Feature 2: Мгновенный парсинг -->
    <g transform="translate(0, 650)">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="#17120a" stroke="url(#gold-border)" stroke-width="1.5" />
      <!-- Lightning Icon -->
      <path d="M 28 14 L 18 28 H 27 L 24 38 L 34 24 H 25 Z" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="72" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Мгновенный парсинг</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">Автоматический сбор данных с Wildberries</text>
    </g>
  </g>

  <!-- RIGHT SIDE CONTENT (AUTH FORM) -->
  <g transform="translate(1080, 180)">
    <!-- Header -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Добро пожаловать</text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">Войдите в систему для доступа к платформе</text>

    <!-- Phone input section -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#71717a" letter-spacing="1">ВХОД ПО НОМЕРУ ТЕЛЕФОНА</text>
      
      <!-- Input box -->
      <rect x="0" y="16" width="620" height="64" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
      <!-- Phone icon -->
      <path d="M 32 40 C 32 42 34 46 38 50 C 42 54 46 56 48 56 L 52 50 L 46 44 L 43 47 C 41 46 38 43 37 41 L 40 38 L 34 32 Z" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -5)" />
      <!-- Placeholder text -->
      <text x="56" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#52525b">+7 (999) 000-000-000</text>
    </g>

    <!-- Continue Button -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="620" height="60" rx="12" fill="url(#gold-btn-grad)" stroke="#614a1a" stroke-width="1" />
      <text x="270" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fef08a" text-anchor="middle">Продолжить</text>
      <path d="M 330 36 L 342 36 M 337 30 L 343 36 L 337 42" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Shield security notice -->
    <g transform="translate(0, 360)">
      <!-- Shield icon -->
      <path d="M 12 6 L 20 2 L 28 6 V 14 C 28 20 20 24 20 24 C 20 24 12 20 12 14 Z" fill="none" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5, 0)" />
      <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#71717a">
        <tspan x="32" dy="0">После ввода номера вам будет предложен бесплатный звонок авторизации или</tspan>
        <tspan x="32" dy="20">SMS-код для подтверждения телефона.</tspan>
      </text>
    </g>

    <!-- Separator OR -->
    <g transform="translate(0, 440)">
      <line x1="0" y1="0" x2="620" y2="0" stroke="#18181b" stroke-width="1" />
      <rect x="230" y="-12" width="160" height="24" fill="#000000" />
      <text x="310" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52525b" text-anchor="middle" letter-spacing="0.5">ИЛИ ВОЙДИТЕ ЧЕРЕЗ</text>
    </g>

    <!-- Google Button -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="620" height="60" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
      <!-- Google 'G' Icon -->
      <g transform="translate(210, 20)">
        <path d="M 19.6 10.23 C 19.6 9.55 19.54 8.9 19.43 8.27 H 10 V 12.16 H 15.38 C 15.15 13.4 14.45 14.45 13.4 15.15 V 17.64 H 16.61 C 18.49 15.91 19.6 13.31 19.6 10.23 Z" fill="#4285F4"/>
        <path d="M 10 20 C 12.7 20 14.97 19.1 16.61 17.64 L 13.4 15.15 C 12.51 15.75 11.36 16.1 10 16.1 C 7.39 16.1 5.18 14.34 4.39 11.98 H 1.07 V 14.55 C 2.72 17.82 6.1 20 10 20 Z" fill="#34A853"/>
        <path d="M 4.39 11.98 C 4.19 11.38 4.08 10.74 4.08 10 C 4.08 9.26 4.19 8.62 4.39 8.02 V 5.45 H 1.07 C 0.39 6.81 0 8.36 0 10 C 0 11.64 0.39 13.19 1.07 14.55 L 4.39 11.98 Z" fill="#FBBC05"/>
        <path d="M 10 3.9 C 11.47 3.9 12.79 4.41 13.83 5.4 L 16.68 2.55 C 14.96 0.97 12.7 0 10 0 C 6.1 0 2.72 2.18 1.07 5.45 L 4.39 8.02 C 5.18 5.66 7.39 3.9 10 3.9 Z" fill="#EA4335"/>
      </g>
      <text x="330" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Продолжить с Google</text>
    </g>

    <!-- Copyright -->
    <text x="310" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#52525b" text-anchor="middle">© 2026 TM LIMITED. Все права защищены.</text>
  </g>
</svg>